info:
  name: Metabase Firebird 2.5.x Driver
  version: 2.0.0
  description: Conecta o Metabase 0.61+ a bancos Firebird 2.5 (e superiores) usando Jaybird 5.
driver:
  name: firebird
  display-name: Firebird
  lazy-load: true
  parent: sql-jdbc
  connection-properties:
    - group:
        container-style: ["grid", "3fr 1fr"]
        fields:
          - host
          - merge:
              - port
              - placeholder: 3050
    - merge:
        - dbname
        - display-name: Caminho ou alias do banco
          placeholder: C:/Dados/BANCO.FDB
    - user
    - password
    - name: charset
      display-name: Charset da conexão
      placeholder: WIN1252
      default: WIN1252
      helper-text: Charset usado pelo Jaybird (WIN1252, ISO8859_1, UTF8, NONE...). Para bancos brasileiros normalmente é WIN1252.
    - ssh-tunnel
    - advanced-options-start
    - merge:
        - additional-options
        - placeholder: 'blobBufferSize=16384'
    - default-advanced-options
init:
  - step: load-namespace
    namespace: metabase.driver.firebird
  - step: register-jdbc-driver
    class: org.firebirdsql.jdbc.FBDriver
